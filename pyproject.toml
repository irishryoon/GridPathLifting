[project]
name = "gridpathlifting"
version = "0.1.0"
description = "Decoding trajectories from grid cell spike trains using topological data analysis"
readme = "README.md"
requires-python = ">=3.11,<3.12"

dependencies = [
    # numpy is held below 2.0: ripser, persim, dreimac and numba are all
    # built against the 1.x ABI in the environment this was ported from.
    "numpy<2",
    "scipy>=1.13,<1.14",
    "pandas>=2.2,<2.3",
    "matplotlib>=3.8,<3.9",
    "seaborn>=0.12,<0.13",
    "scikit-learn>=1.4,<1.5",
    "numba>=0.59,<0.60",
    "h5py>=3.12,<4",
    "opencv-python-headless>=4.10,<5",
    "tqdm>=4.66",
    "ipython>=8.24",
    "ipykernel>=6.29",
    # TDA stack
    "ripser>=0.6.8",
    "persim>=0.3.5",
    "gudhi>=3.9",
    "dreimac>=0.3.1",
]

[tool.setuptools]
py-modules = []
